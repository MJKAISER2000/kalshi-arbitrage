[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-arbitrage"
version = "0.1.0"
description = "Research platform for Kalshi arbitrage and relative value, with fee- and liquidity-aware profitability proofs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.7",
    "cryptography>=42.0",   # RSA-PSS request signing
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Kept separate so the money math can be tested without a scientific stack installed.
analysis = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13"]
# Phase 4 uses stdlib sqlite3; sqlalchemy arrives if/when we move to Postgres.
storage = ["sqlalchemy>=2.0"]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_arb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits the real Kalshi API; skipped by default, run with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["kalshi_arb"]
mypy_path = "src"
strict = true
warn_unreachable = true
